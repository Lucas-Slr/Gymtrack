name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json
        
    - name: Install backend dependencies
      run: |
        cd backend
        npm ci
        
    - name: Run backend tests
      env:
        NODE_ENV: test
        JWT_SECRET: test-secret-key
        JWT_REFRESH_SECRET: test-refresh-secret-key
      run: |
        cd backend
        npm test
        
    - name: Run backend linting
      run: |
        cd backend
        npm run lint || echo "Linting not configured, skipping..."

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: Frontend/package-lock.json
        
    - name: Install frontend dependencies
      run: |
        cd Frontend
        npm ci
        
    - name: Run frontend tests
      run: |
        cd Frontend
        npm test --run
        
    - name: Build frontend
      run: |
        cd Frontend
        npm run build
        
    - name: Run frontend linting
      run: |
        cd Frontend
        npm run lint || echo "Linting not configured, skipping..."

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: Frontend/package-lock.json
        
    - name: Install frontend dependencies
      run: |
        cd Frontend
        npm ci
        
    - name: Build frontend
      run: |
        cd Frontend
        npm run build
        
    - name: Build success
      run: |
        echo "✅ Build completed successfully!"
        echo "Frontend build: OK"
        echo "Backend tests: OK"
