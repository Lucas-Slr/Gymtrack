<div class="min-h-screen bg-gray-900 flex">
    <!-- Image de fitness à gauche -->
  <div class="hidden lg:flex lg:w-1/2 relative overflow-hidden">
    <!-- Image en arrière-plan qui couvre toute la section -->
    <img 
      src="fitness-login.jpg" 
      alt="Fitness background" 
      class="absolute inset-0 w-full h-full object-cover object-center"
      style="width: 100%; height: 100%; object-fit: cover; object-position: center;"
    />
    
    <!-- Overlay pour améliorer la lisibilité -->
    <div class="absolute inset-0 bg-black/30"></div>
    
    <!-- Contenu centré -->
    <div class="relative z-10 w-full h-full flex items-center justify-center">
      <div class="text-center text-white">
        <h2 class="text-3xl font-bold mb-2">GYM TRACK</h2>
        <p class="text-lg text-gray-200">Votre partenaire fitness</p>
      </div>
    </div>
  </div>

  <!-- Formulaire de connexion -->
  <div class="flex-1 flex items-center justify-center p-8">
    <div class="w-full max-w-md">
      <!-- Logo et titre -->
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-16 h-16 bg-green-600 rounded-full mb-4">
          <span class="text-white text-2xl font-bold">G</span>
        </div>
        <h1 class="text-3xl font-bold text-white mb-2">GYM TRACK</h1>
        <p class="text-gray-400">Connectez-vous à votre compte</p>
      </div>

      <!-- Formulaire -->
      <div class="bg-gray-800 rounded-lg p-8 shadow-xl">
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">
          <!-- Email -->
          <div>
            <label for="email" class="block text-sm font-medium text-gray-300 mb-2">Adresse email</label>
            <input 
              id="email" 
              type="email" 
              formControlName="email" 
              placeholder="votre@email.com"
              class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent"
            />
          </div>

          <!-- Mot de passe -->
          <div>
            <label for="password" class="block text-sm font-medium text-gray-300 mb-2">Mot de passe</label>
            <div class="relative">
              <input 
                id="password" 
                [type]="showPassword ? 'text' : 'password'" 
                formControlName="password" 
                placeholder="Votre mot de passe"
                class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent pr-12"
              />
              <button 
                type="button" 
                (click)="togglePassword()"
                class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-white"
              >
                <svg *ngIf="!showPassword" class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                  <path d="M10 12a2 2 0 100-4 2 2 0 000 4z"/>
                  <path fill-rule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clip-rule="evenodd"/>
                </svg>
                <svg *ngIf="showPassword" class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                  <path fill-rule="evenodd" d="M3.707 2.293a1 1 0 00-1.414 1.414l14 14a1 1 0 001.414-1.414l-1.473-1.473A10.014 10.014 0 0019.542 10C18.268 5.943 14.478 3 10 3a9.958 9.958 0 00-4.512 1.074l-1.78-1.781zm4.261 4.26l1.514 1.515a2.003 2.003 0 012.45 2.45l1.514 1.514a4 4 0 00-5.478-5.478z" clip-rule="evenodd"/>
                  <path d="M12.454 16.697L9.75 13.992a4 4 0 01-3.742-3.741L2.335 6.578A9.98 9.98 0 00.458 10c1.274 4.057 5.065 7 9.542 7 .847 0 1.669-.105 2.454-.303z"/>
                </svg>
              </button>
            </div>
          </div>

          <!-- Options -->
          <div class="flex items-center justify-between">
            <label class="flex items-center">
              <input type="checkbox" formControlName="rememberMe" class="w-4 h-4 text-green-600 bg-gray-700 border-gray-600 rounded focus:ring-green-500 focus:ring-2">
              <span class="ml-2 text-sm text-gray-300">Se souvenir de moi</span>
            </label>
            <a href="#" class="text-sm text-green-500 hover:text-green-400">Mot de passe oublié ?</a>
          </div>

          <!-- Message d'erreur -->
          <div *ngIf="errorMessage" class="bg-red-600 text-white p-3 rounded-lg text-sm">
            {{ errorMessage }}
          </div>

          <!-- Bouton de connexion -->
          <button 
            type="submit" 
            [disabled]="!loginForm.valid || isLoading"
            class="w-full py-3 px-4 bg-green-600 text-white rounded-lg hover:bg-green-700 transition disabled:opacity-50 disabled:cursor-not-allowed font-medium flex items-center justify-center"
          >
            <span *ngIf="!isLoading">Se connecter</span>
            <span *ngIf="isLoading" class="flex items-center">
              <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
              Connexion en cours...
            </span>
          </button>
        </form>



        <!-- Lien d'inscription -->
        <div class="mt-6 text-center">
          <span class="text-gray-400">Pas encore de compte ? </span>
          <a routerLink="/register" class="text-green-500 hover:text-green-400 font-medium">S'inscrire maintenant</a>
        </div>
      </div>
    </div>
  </div>
</div>
