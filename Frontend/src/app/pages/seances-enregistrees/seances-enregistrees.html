<div class="min-h-screen bg-gray-900 text-white">
  <!-- Header -->
  <div class="bg-gray-800 border-b border-gray-700">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <div class="flex items-center">
          <button 
            (click)="navigateToDashboard()"
            class="text-gray-300 hover:text-white transition mr-4"
          >
            <app-icon name="arrow-back" size="md" className="text-gray-300"></app-icon>
          </button>
          <h1 class="text-xl font-semibold">Séances enregistrées</h1>
        </div>
        <button 
          (click)="navigateToCreation()"
          class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition flex items-center gap-2"
        >
          <app-icon name="add" size="sm" className="text-white"></app-icon>
          Nouvelle séance
        </button>
      </div>
    </div>
  </div>

  <!-- Content -->
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <!-- Loading State -->
    <div *ngIf="isLoading" class="flex justify-center items-center py-12">
      <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-green-500"></div>
    </div>

    <!-- Error Message -->
    <div *ngIf="errorMessage" class="mb-6 p-4 bg-red-600 text-white rounded-lg">
      {{ errorMessage }}
    </div>

    <!-- Empty State -->
    <div *ngIf="!isLoading && seancesEnregistrees.length === 0" class="text-center py-12">
      <div class="w-24 h-24 bg-gray-700 rounded-full mx-auto mb-6 flex items-center justify-center">
        <app-icon name="bookmark" size="lg" className="text-gray-400"></app-icon>
      </div>
      <h3 class="text-xl font-semibold text-gray-300 mb-2">Aucune séance enregistrée</h3>
      <p class="text-gray-400 mb-6">
        Créez une nouvelle séance et cochez "Enregistrer cette séance" pour la retrouver ici.
      </p>
      <button 
        (click)="navigateToCreation()"
        class="px-6 py-3 bg-green-600 text-white rounded-lg hover:bg-green-700 transition"
      >
        Créer ma première séance
      </button>
    </div>

               <!-- Séances List -->
           <div *ngIf="!isLoading && seancesEnregistrees.length > 0" class="space-y-6">
             <div class="flex items-center justify-between">
               <h2 class="text-2xl font-bold">Vos séances enregistrées</h2>
               <span class="text-gray-400">{{ seancesEnregistrees.length }} séance(s)</span>
             </div>

             <!-- Tableau avancé -->
             <app-seances-enregistrees-table
               [seances]="seancesEnregistrees"
               (seanceLancee)="onSeanceLancee($event)"
               (seanceModifiee)="onSeanceModifiee($event)"
               (seanceSupprimee)="onSeanceSupprimee($event)">
             </app-seances-enregistrees-table>
           </div>
  </div>
</div>
