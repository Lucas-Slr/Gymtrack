version: '3.8'

services:
  # Base de données MongoDB
  mongodb:
    image: mongo:7.0
    container_name: gymtrack-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: gymtrack
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./backend/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - gymtrack-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gymtrack-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://admin:password123@mongodb:27017/gymtrack?authSource=admin
      - JWT_SECRET=8ca3d728edae213105e58b33fb6edb2c0679fac794fccbaf62d18d2a7b9b16f0c68af63c8ef281b9e7bc36eb699038d2bf866573efe0c3994d016ecdeb45f231
      - JWT_REFRESH_SECRET=0b7e262b573bc985f5701bd3306bb5093818d655074408c2b7c6998bd1fb9441f3186706320f3d4526273f53f366a3cb083310b74c2ca87c11789afb7e91c2e8
      - FRONTEND_URL=http://localhost
    ports:
      - "5000:5000"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - gymtrack-network
    volumes:
      - ./backend:/app
      - /app/node_modules

  # Frontend Angular
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: gymtrack-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - gymtrack-network

volumes:
  mongodb_data:
    driver: local

networks:
  gymtrack-network:
    driver: bridge
